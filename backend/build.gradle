plugins {
    id 'groovy'
    id 'org.springframework.boot' version '4.1.1'
}

group = 'ca.fnord'
version = '0.3.0-M2'
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral() }

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    implementation 'org.apache.groovy:groovy'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'net.java.dev.jna:jna:5.18.1'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyLocking { lockAllConfigurations() }
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    maxHeapSize = '256m'
    maxParallelForks = 1
    testLogging { events 'failed', 'skipped'; exceptionFormat = 'full' }
}
test { useJUnitPlatform { excludeTags 'postgres', 'docker' } }
tasks.register('integrationTest', Test) {
    description = 'Real PostgreSQL integration tests; Testcontainers or FNORD_TEST_DB_URL.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'postgres' }
    shouldRunAfter test
}
tasks.register('resolveDependencies') {
    doLast { configurations.findAll { it.canBeResolved }.each { it.resolve() } }
}
bootJar { archiveFileName = 'fnord-dedup.jar' }
jar { enabled = false }
tasks.register('inventoryBrowserFixture', JavaExec) {
    description = 'Test-only server with generated native fixtures. Never uses operator sources.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ca.fnord.dedup.inventory.InventoryBrowserFixture'
    maxHeapSize = '256m'
}
