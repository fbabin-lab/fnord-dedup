services:
  postgres:
    # Explicit disposable-database mode. This preserves normal PostgreSQL
    # transactional behavior during clean operation but deliberately removes
    # crash-durability guarantees to reduce HDD write latency.
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      - -c
      - wal_level=minimal
      - -c
      - max_wal_senders=0
      - -c
      - shared_buffers=256MB
      - -c
      - checkpoint_timeout=30min
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - max_wal_size=8GB
      - -c
      - min_wal_size=1GB
      - -c
      - wal_compression=on
