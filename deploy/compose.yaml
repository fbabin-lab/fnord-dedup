services:
  postgres:
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    environment:
      POSTGRES_DB: fnord
      POSTGRES_USER: fnord
      POSTGRES_PASSWORD_FILE: /run/secrets/spring.datasource.password
    secrets:
      - source: database_password
        target: spring.datasource.password
    volumes:
      - database:/var/lib/postgresql
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U fnord -d fnord']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 1g
    pids_limit: 128
    logging: &logging
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
  backend:
    image: ${COMPOSE_PROJECT_NAME:-fnord-dedup}-backend:0.1.0-M0
    build: ../backend
    platform: linux/amd64
    environment:
      FNORD_SECURE_COOKIES: ${FNORD_SECURE_COOKIES:-false}
      FNORD_SECURITY_USERNAME: ${FNORD_OPERATOR_USERNAME:-operator}
    secrets:
      - source: database_password
        target: spring.datasource.password
      - source: operator_password_hash
        target: fnord.security.password-hash
    volumes:
      - artifacts:/var/lib/fnord/artifacts
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /run/jna:size=16m,mode=0700,uid=10001,gid=10001,exec,nosuid,nodev
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [application, database]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8080/api/v1/system/health]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 2g
    pids_limit: 256
    logging: *logging
  frontend:
    image: ${COMPOSE_PROJECT_NAME:-fnord-dedup}-frontend:0.1.0-M0
    build: ../frontend
    ports: ['${FNORD_BIND_ADDRESS:-127.0.0.1}:${FNORD_PORT:-8088}:8080']
    tmpfs: ['/tmp:size=32m,mode=1777']
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [application]
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 128m
    pids_limit: 64
    logging: *logging
networks:
  application: {}
  database: { internal: true }
volumes:
  database: {}
  artifacts: {}
secrets:
  database_password:
    file: ./secrets/database-password
  operator_password_hash:
    file: ./secrets/operator-password-hash
