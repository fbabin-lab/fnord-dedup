openapi: 3.1.0
info:
  title: Fnord Dedup scan and evidence API
  version: 0.3.0-M2
  description: Durable inventory, repeated-size SHA-256 hashing and immutable duplicate analysis. Unique-size hashing requires
    an explicit manual request. No source mutations, raw downloads or arbitrary-path inputs.
servers:
- url: /api/v1
security:
- session: []
paths:
  /session:
    get:
      operationId: session
      security: []
      description: Returns session state and issues a readable XSRF-TOKEN cookie. Call again after login/logout.
      responses:
        '200':
          description: Session state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
  /session/login:
    post:
      operationId: login
      security: []
      parameters:
      - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - username
              - password
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        '204':
          description: Authenticated; rotated HttpOnly session cookie
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /session/logout:
    post:
      operationId: logout
      parameters:
      - $ref: '#/components/parameters/Csrf'
      responses:
        '204':
          description: Session invalidated
        '403':
          $ref: '#/components/responses/Problem'
  /sources:
    get:
      operationId: sources
      description: Cached startup/job validation. Does not perform filesystem reads.
      responses:
        '200':
          description: Registered sources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceList'
        '401':
          $ref: '#/components/responses/Problem'
  /system/info:
    get:
      operationId: systemInfo
      responses:
        '200':
          description: Implemented capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
        '401':
          $ref: '#/components/responses/Problem'
  /system/health:
    get:
      operationId: health
      security: []
      responses:
        '200':
          description: Application and database ready; source availability is independent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /scans:
    post:
      operationId: createScan
      description: Queue whole registered roots, inventory metadata, hash only repeated-size regular files, then publish duplicate
        analysis. At most ten unfinished jobs and five creations per actor per minute.
      parameters:
      - $ref: '#/components/parameters/Csrf'
      - $ref: '#/components/parameters/Idempotency'
      responses:
        '202':
          description: Queued; not completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanCreated'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanRequest'
    get:
      operationId: scans
      description: Scan history, oldest first with a stable committed cutoff.
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Stored metadata / durable state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /scans/{scanId}:
    get:
      operationId: scan
      description: Captured source scope, coverage and durable progress. Completion is inventory-only.
      parameters:
      - name: scanId
        in: path
        required: true
        schema: &id001
          type: string
          format: uuid
      responses:
        '200':
          description: Stored metadata / durable state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scan'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /jobs:
    get:
      operationId: jobs
      description: Job history, oldest first with a stable committed cutoff.
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Stored metadata / durable state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /jobs/{jobId}:
    get:
      operationId: job
      description: Durable counters; discovery total is unknown. Waiting for I/O means no checkpoint for five seconds, not
        proof of a kernel hang.
      parameters:
      - name: jobId
        in: path
        required: true
        schema: *id001
      responses:
        '200':
          description: Stored metadata / durable state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /jobs/{jobId}/pause:
    post:
      operationId: pauseJob
      description: Request cooperative pause. PAUSED acknowledges that worker handles have reached a safe point.
      parameters:
      - name: jobId
        in: path
        required: true
        schema: *id001
      - $ref: '#/components/parameters/Csrf'
      responses:
        '200':
          description: Stored metadata / durable state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /jobs/{jobId}/resume:
    post:
      operationId: resumeJob
      description: Validate captured configuration, all selected roots and root identities before requeueing a PAUSED or INTERRUPTED
        job.
      parameters:
      - name: jobId
        in: path
        required: true
        schema: *id001
      - $ref: '#/components/parameters/Csrf'
      responses:
        '200':
          description: Stored metadata / durable state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /jobs/{jobId}/cancel:
    post:
      operationId: cancelJob
      description: Cancel wins pause races. Running work acknowledges cancellation at a safe point. Terminal completion cannot
        be relabeled.
      parameters:
      - name: jobId
        in: path
        required: true
        schema: *id001
      - $ref: '#/components/parameters/Csrf'
      responses:
        '200':
          description: Stored metadata / durable state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /jobs/{jobId}/errors:
    get:
      operationId: jobErrors
      description: Paged structured errors; committed inventory remains accessible.
      parameters:
      - name: jobId
        in: path
        required: true
        schema: *id001
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Stored metadata / durable state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /scans/{scanId}/directories/{locationId}/children:
    get:
      operationId: children
      description: Committed observations from PostgreSQL only. No source reads. Unknown totals and partial coverage are explicit.
      parameters:
      - name: scanId
        in: path
        required: true
        schema: *id001
      - name: locationId
        in: path
        required: true
        schema: *id001
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Stored metadata / durable state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildrenPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /observations/{entryId}:
    get:
      operationId: observation
      description: One immutable scan observation with append-only instability evidence; no live file access.
      parameters:
      - name: entryId
        in: path
        required: true
        schema: *id001
      responses:
        '200':
          description: Stored metadata / durable state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Observation'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /hash-jobs:
    post:
      operationId: createHashJob
      description: Explicit bounded selection in one frozen scan. Normal requests reuse accepted hashes without refreshing
        their timestamps; forceRehash reads anew. A conflicting fresh digest invalidates active evidence. Jobs use the same
        admission, control and lease rules as scans.
      parameters:
      - $ref: '#/components/parameters/Csrf'
      - $ref: '#/components/parameters/Idempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HashRequest'
      responses:
        '202':
          description: Saved result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HashCreated'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /observations/{id}/hash-attempts:
    get:
      operationId: hashAttempts
      parameters:
      - name: id
        in: path
        required: true
        schema: &id002
          type: string
          format: uuid
      - $ref: '#/components/parameters/Cursor'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 20
      responses:
        '200':
          description: Saved result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HashAttemptPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /scans/{id}/duplicate-groups:
    get:
      operationId: duplicateGroups
      parameters:
      - name: id
        in: path
        required: true
        schema: *id002
      - $ref: '#/components/parameters/Cursor'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
      - name: analysisId
        in: query
        schema: *id002
        description: Pin the published revision while paging. Omitting it selects the current revision; a cursor from a different
          revision is rejected.
      responses:
        '200':
          description: Saved result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /duplicate-groups/{id}:
    get:
      operationId: duplicateGroup
      parameters:
      - name: id
        in: path
        required: true
        schema: *id002
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Saved result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupDetail'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: JSESSIONID
  parameters:
    Csrf:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: Exact current XSRF-TOKEN cookie value; session cookie is separately HttpOnly.
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor scoped to this view and its committed sequence cutoff. Refresh without a cursor to see newly
        committed rows.
      schema: &id006
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    Idempotency:
      name: Idempotency-Key
      in: header
      description: Retained at least 24 hours (currently indefinitely). Repeating the same normalized request returns its
        original response, even at capacity.
      schema:
        type: string
        minLength: 1
        maxLength: 128
  responses:
    Problem:
      description: Structured error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Session:
      type: object
      required:
      - authenticated
      - username
      properties:
        authenticated:
          type: boolean
        username:
          type:
          - string
          - 'null'
    Health:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - UP
          - DOWN
    SystemInfo:
      type: object
      required:
      - name
      - version
      - milestone
      - platform
      - sourcePolicy
      - scanAvailable
      - configurationRevision
      - inventoryOnly
      properties:
        name:
          type: string
        version:
          type: string
        milestone:
          type: string
          const: M2
        platform:
          type: string
        sourcePolicy:
          type: string
          const: READ_ONLY
        scanAvailable:
          type: boolean
          const: true
        configurationRevision:
          type: string
          pattern: ^[0-9a-f]{64}$
        inventoryOnly:
          type: boolean
          const: false
    SourceList:
      type: object
      required:
      - configurationRevision
      - sources
      properties:
        configurationRevision:
          type: string
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
    Source:
      type: object
      required:
      - id
      - sourceInstanceId
      - key
      - label
      - containerPath
      - enabled
      - crossMounts
      - status
      - detail
      - excludedMountCount
      properties:
        id:
          type: string
          format: uuid
        sourceInstanceId:
          type: string
          format: uuid
        key:
          type: string
        label:
          type: string
        containerPath:
          type: string
        enabled:
          type: boolean
        crossMounts:
          type: boolean
        status:
          type: string
        detail:
          type: string
        excludedMountCount:
          type: integer
          minimum: 0
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - code
      - detail
      - correlationId
      - retriable
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        correlationId:
          type: string
          format: uuid
        retriable:
          type: boolean
    ScanRequest:
      type: object
      required:
      - name
      - sourceIds
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        sourceIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: *id001
        hashAlgorithm:
          type: string
          enum:
          - SHA-256
          default: SHA-256
        includeSignatureCandidates:
          type: boolean
          const: false
          default: false
        textIndexingEnabled:
          type: boolean
          const: false
          default: false
      additionalProperties: false
    ScanCreated:
      type: object
      required:
      - scanId
      - jobId
      - inventoryOnly
      properties:
        scanId: *id001
        jobId: *id001
        inventoryOnly:
          type: boolean
          description: False for new M2 scans. Replaying a historical M1 idempotency key preserves its original true value.
    Job:
      type: object
      required:
      - id
      - scanId
      - type
      - phase
      - state
      - version
      - createdAt
      - updatedAt
      - startedAt
      - finishedAt
      - heartbeatAt
      - checkpointAt
      - currentSourceId
      - currentPath
      - blockCode
      - leaseSeconds
      - heartbeatSeconds
      - discoveredEntries
      - discoveredFiles
      - discoveredDirectories
      - discoveredBytes
      - errorCount
      - skippedEntries
      - pendingWork
      - completedWork
      - totalKnown
      - waitingForIo
      - candidateFiles
      - candidateBytes
      - hashedFiles
      - reusedFiles
      - physicalBytesRead
      - usefulBytesHashed
      properties:
        id: *id001
        scanId: *id001
        type:
          type: string
          enum:
          - INVENTORY
          - SCAN
          - HASH
        phase:
          type: string
          enum:
          - INVENTORY
          - CANDIDATE_SELECTION
          - HASHING
          - ANALYSIS
        state:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - PAUSE_REQUESTED
          - PAUSED
          - CANCEL_REQUESTED
          - CANCELLED
          - INTERRUPTED
          - COMPLETED
          - COMPLETED_WITH_ERRORS
          - FAILED
        version: &id004
          type: string
          pattern: ^[0-9]+$
        createdAt: &id003
          type: string
          format: date-time
        updatedAt: *id003
        startedAt:
          type:
          - string
          - 'null'
          format: date-time
        finishedAt:
          type:
          - string
          - 'null'
          format: date-time
        heartbeatAt:
          type:
          - string
          - 'null'
          format: date-time
        checkpointAt:
          type:
          - string
          - 'null'
          format: date-time
        currentSourceId:
          type:
          - string
          - 'null'
          format: uuid
        currentPath:
          type:
          - string
          - 'null'
        blockCode:
          type:
          - string
          - 'null'
        leaseSeconds:
          type: integer
          const: 60
        heartbeatSeconds:
          type: integer
          const: 10
        discoveredEntries: *id004
        discoveredFiles: *id004
        discoveredDirectories: *id004
        discoveredBytes: *id004
        errorCount: *id004
        skippedEntries: *id004
        pendingWork: *id004
        completedWork: *id004
        totalKnown: &id007
          type: boolean
        waitingForIo: &id009
          type: boolean
        candidateFiles: &id005
          type: string
          pattern: ^[0-9]+$
        candidateBytes: *id005
        hashedFiles: *id005
        reusedFiles: *id005
        physicalBytesRead: *id005
        usefulBytesHashed: *id005
    ScanSource:
      type: object
      required:
      - sourceId
      - sourceInstanceId
      - label
      - rootLocationId
      - coverage
      properties:
        sourceId: *id001
        sourceInstanceId: *id001
        label: *id006
        rootLocationId: *id001
        coverage:
          type: string
          enum: &id008
          - COMPLETE
          - PARTIAL
          - UNAVAILABLE
          - EXCLUDED_BY_POLICY
    Scan:
      type: object
      required:
      - id
      - name
      - configurationRevision
      - createdAt
      - inventoryFrozenAt
      - inventoryOnly
      - analysisAvailable
      - job
      - sources
      - analysisId
      - evidenceRevision
      - latestJob
      - activeHashJobs
      properties:
        id: *id001
        name: *id006
        configurationRevision: *id006
        createdAt: *id003
        inventoryFrozenAt:
          type:
          - string
          - 'null'
