components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: JSESSIONID
  parameters:
    Csrf:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: Exact current XSRF-TOKEN cookie value; session cookie is separately HttpOnly.
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor scoped to this view and its committed sequence cutoff. Refresh without a cursor to see newly
        committed rows.
      schema: &id016
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    Idempotency:
      name: Idempotency-Key
      in: header
      description: Retained at least 24 hours (currently indefinitely). Repeating the same normalized request returns its
        original response, even at capacity.
      schema:
        type: string
        minLength: 1
        maxLength: 128
  responses:
    Problem:
      description: Structured error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Session:
      type: object
      required:
      - authenticated
      - username
      properties:
        authenticated:
          type: boolean
        username:
          type:
          - string
          - 'null'
    Health:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - UP
          - DOWN
    SystemInfo:
      type: object
      required:
      - name
      - version
      - milestone
      - platform
      - sourcePolicy
      - scanAvailable
      - configurationRevision
      - inventoryOnly
      properties:
        name:
          type: string
        version:
          type: string
        milestone:
          type: string
          const: M4
        platform:
          type: string
        sourcePolicy:
          type: string
          const: READ_ONLY
        scanAvailable:
          type: boolean
          const: true
        configurationRevision:
          type: string
          pattern: ^[0-9a-f]{64}$
        inventoryOnly:
          type: boolean
          const: false
    SourceList:
      type: object
      required:
      - configurationRevision
      - sources
      properties:
        configurationRevision:
          type: string
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
    Source:
      type: object
      required:
      - id
      - sourceInstanceId
      - key
      - label
      - containerPath
      - enabled
      - crossMounts
      - unsafeFast
      - status
      - detail
      - excludedMountCount
      properties:
        id:
          type: string
          format: uuid
        sourceInstanceId:
          type: string
          format: uuid
        key:
          type: string
        label:
          type: string
        containerPath:
          type: string
        enabled:
          type: boolean
        crossMounts:
          type: boolean
        unsafeFast:
          type: boolean
        status:
          type: string
        detail:
          type: string
