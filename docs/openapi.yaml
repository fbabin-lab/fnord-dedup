          type: string
          format: date-time
          description: UTC ISO instant ending in Z. Lower inclusive, upper exclusive; nanoseconds retained.
        mtimeTo:
          type: string
          format: date-time
          description: UTC ISO instant ending in Z. Lower inclusive, upper exclusive; nanoseconds retained.
        nameBytesBase64:
          type: string
          contentEncoding: base64
        pathBytesBase64:
          type: string
          contentEncoding: base64
        entryType:
          type: string
          enum:
          - REGULAR
          - DIRECTORY
          - SYMLINK
          - SPECIAL
          - UNKNOWN
        checksum:
          type: string
          pattern: ^[0-9a-fA-F]{64}$
        checksumPrefix:
          type: string
          pattern: ^[0-9a-fA-F]{1,64}$
        hashStatus: &id020
          type: string
          enum:
          - ACCEPTED
          - PENDING
          - FAILED
          - STALE
          - INELIGIBLE
          - NOT_REQUESTED
          - NOT_REQUESTED_UNIQUE_SIZE
        duplicateState: &id022
          type: string
          enum:
          - DUPLICATE
          - STALE
          - NOT_GROUPED
        tagIds:
          type: array
          items: *id003
          maxItems: 100
        tagMode:
          type: string
          enum:
          - ANY
          - ALL
          description: 'Server default: ANY.'
        reviewState:
          $ref: '#/components/schemas/ReviewState'
        hasError: *id019
        stale: *id019
        annotationsNeedReview: *id019
    SearchQuery:
