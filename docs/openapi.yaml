    HashAttempt:
      type: object
      required:
      - id
      - jobId
      - algorithm
      - digest
      - bytesRead
      - startedAt
      - completedAt
      - reasons
      - outcome
      - errorCode
      - errorDetail
      - preFingerprint
      - postFingerprint
      properties:
        id: *id002
        jobId: *id002
        algorithm:
          type: string
          const: SHA-256
        digest:
          anyOf:
          - &id012
            type: string
            pattern: ^[0-9a-f]{64}$
          - type: 'null'
        bytesRead: *id005
        startedAt: &id010
          type: string
          format: date-time
        completedAt:
          anyOf:
          - *id010
          - type: 'null'
        reasons:
          type: array
          items:
            type: string
            enum:
            - DUPLICATE_SIZE
            - MANUAL
            - FORCED_RECHECK
        outcome:
          type: string
          enum:
          - READING
          - ACCEPTED
          - FAILED
          - INTERRUPTED
          - STOPPED
          - CONFLICT
        errorCode:
          anyOf:
          - &id011
            type: string
          - type: 'null'
        errorDetail:
          anyOf:
          - *id011
          - type: 'null'
        preFingerprint:
          anyOf:
          - type: object
            additionalProperties: true
          - type: 'null'
        postFingerprint:
          anyOf:
          - type: object
            additionalProperties: true
          - type: 'null'
